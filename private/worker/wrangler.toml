# PIP POPPER PRIVATE — Cloudflare Worker settings (used from step 2: deploy).
# No password or key is written here. Set them only as secrets (Producer types them):
#   npx wrangler secret put PRIVATE_PASSWORD
#   npx wrangler secret put SESSION_KEY
name = "pip-popper-private"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
send_metrics = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "pip-popper-private-audio"

# Login lockout (strict): one Durable Object per connection. SQLite storage = available on the Workers Free plan.
[[durable_objects.bindings]]
name = "LOGIN_GUARD"
class_name = "LoginGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LoginGuard"]
